# =============================================================================
# Vexium Panel — configuration
# Edit this file to match your setup, then (re)start the panel.
# =============================================================================

panel:
  # Interface to bind the web server to. Keep this 127.0.0.1 unless you're
  # putting a reverse proxy in front of it, or you actually want it reachable
  # over the LAN.
  bind: "127.0.0.1"
  port: 8080
  # Random string used to sign session cookies. Change this to something
  # random before you expose the panel to anyone.
  sessionSecret: "CHANGE_ME_TO_A_RANDOM_STRING"

servers:
  # Every server/proxy this panel manages lives in here now, not in this
  # file — see config/servers.yml. Backups and schedules are automatically
  # namespaced per server under data/backups/<id>/ and data/schedules/<id>.json,
  # so you don't configure those paths per server either.
  file: "./config/servers.yml"

activity:
  file: "./data/activity.yml"

failedLogins:
  # IP addresses and user agents of failed sign-in attempts. Owner-only,
  # viewable from Administrator Management -> User History.
  file: "./data/failed-logins.yml"

avatars:
  # Where self-service profile pictures are stored, one file per username.
  directory: "./data/avatars"

branding:
  # Server display name and icon shown in the panel. Editable from the
  # MC Configuration tab, or by hand here / in branding.yml.
  file: "./config/branding.yml"

updates:
  # Checks github.com/TheW0NK/Interstellar-console/releases and compares
  # against the "version" field in branding.yml. Owners get a notice on
  # login if a newer release exists. Never blocks login on failure.
  checkForUpdates: true
  # Prereleases (e.g. betas) are ignored by default — only a newer
  # *stable* release triggers the notice. Set true to also be notified
  # about prereleases.
  includePrereleases: false

users:
  # Local accounts — kept as a dormant fallback for genuine emergencies
  # (GUS unreachable). Not the primary login path when GUS is enabled;
  # see the login screen's "Sign in with a local account instead" link.
  file: "./config/users.yml"

gus:
  file: "./config/gus.yml"
  # Local, per-app roster of Fine Permission overrides for GUS-authenticated
  # accounts. GUS has no "list all users" endpoint for apps — this file is
  # built up as people actually log in, not pre-populated. Role is always
  # read from GUS at login time (read-only here, never edited locally).
  usersFile: "./config/gus-users.yml"
